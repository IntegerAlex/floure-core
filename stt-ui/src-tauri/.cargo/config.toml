# No hardcoded target — Cargo auto-detects host platform.
# Build with: pnpm tauri build

[env]
# Lets the compiler find user-local SPIRV-Headers (needed by the
# llama.cpp Vulkan backend; installed without sudo under ~/.local).
# force=false so an explicitly exported value still wins.
CPLUS_INCLUDE_PATH = { value = "/home/akshat/.local/include", force = false }
