[package]
name = "floure-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local-first dictation with a native GPUI interface"
authors = ["Akshat Kotpalliwar <inquiry.akshatkotpalliwar@gmail.com>"]
readme.workspace = true

[[bin]]
name = "floure"
path = "src/main.rs"

[dependencies]
async-broadcast = "0.7"
floure-core = { path = "../floure-core" }
global-hotkey = "0.9"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
serde_json = "1"
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true, features = ["wayland", "x11"] }
gpui-pre-wgpu = { workspace = true }
gpui-component = { workspace = true }
gpui-base = { workspace = true }
gpui-kit-assets = { workspace = true }

# Wayland global shortcut, opt-in and `input`-group gated. Linux only: the
# other global-hotkey platforms keep the X11/Windows/macOS path.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[package.metadata.deb]
maintainer = "Akshat Kotpalliwar <inquiry.akshatkotpalliwar@gmail.com>"
copyright = "2026, Akshat Kotpalliwar"
license-file = ["../../LICENSE", "3"]
extended-description = "Local-first dictation: speak, clean up, and type where the cursor is."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
  ["../../target/release/floure", "usr/bin/", "755"],
  ["../../packaging/floure.desktop", "usr/share/applications/", "644"],
  ["../../packaging/floure.metainfo.xml", "usr/share/metainfo/", "644"],
  ["../../packaging/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/floure.png", "644"],
  ["../../packaging/icons/48x48.png", "usr/share/icons/hicolor/48x48/apps/floure.png", "644"],
  ["../../packaging/icons/64x64.png", "usr/share/icons/hicolor/64x64/apps/floure.png", "644"],
  ["../../packaging/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/floure.png", "644"],
  ["../../packaging/icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/floure.png", "644"],
  ["../../packaging/icons/512x512.png", "usr/share/icons/hicolor/512x512/apps/floure.png", "644"],
  ["../../packaging/icons/floure.svg", "usr/share/icons/hicolor/scalable/apps/floure.svg", "644"],
  ["../../LICENSE", "usr/share/licenses/floure/", "644"],
  ["assets/fonts/OFL.txt", "usr/share/licenses/floure/OFL-Inter.txt", "644"],
]

[package.metadata.generate-rpm]
name = "floure"
summary = "Local-first dictation with a native GPUI interface"
license = "GPL-3.0-or-later"
url = "https://www.floure.in/"
assets = [
  { source = "../../target/release/floure", dest = "/usr/bin/floure", mode = "755" },
  { source = "../../packaging/floure.desktop", dest = "/usr/share/applications/floure.desktop", mode = "644" },
  { source = "../../packaging/floure.metainfo.xml", dest = "/usr/share/metainfo/floure.metainfo.xml", mode = "644" },
  { source = "../../packaging/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/floure.png", mode = "644" },
  { source = "../../packaging/icons/floure.svg", dest = "/usr/share/icons/hicolor/scalable/apps/floure.svg", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/licenses/floure/LICENSE", mode = "644" },
  { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/floure/OFL-Inter.txt", mode = "644" },
]
