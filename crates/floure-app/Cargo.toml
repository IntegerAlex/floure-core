[package]
name = "floure-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "floure"
path = "src/main.rs"

[dependencies]
async-broadcast = "0.7"
floure-core = { path = "../floure-core" }
global-hotkey = "0.9"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
serde_json = "1"
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true, features = ["wayland", "x11"] }
gpui-pre-wgpu = { workspace = true }
gpui-component = { workspace = true }
gpui-base = { workspace = true }
gpui-kit-assets = { workspace = true }
