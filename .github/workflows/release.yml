name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve Release
    # Runs for tag pushes, manual dispatch, and pushes to master whose head
    # commit subject begins with `release v<version>`.
    if: |
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release v'))
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
          fetch-depth: 0
      - name: Resolve tag and release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -1)
            VERSION=$(printf '%s' "$SUBJECT" \
              | grep -oE '^release v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
              | sed 's/^release v//')
            if [ -z "$VERSION" ]; then
              echo "::error::$(git rev-parse --short HEAD) has no 'release v<version>' keyword"
              exit 1
            fi
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.id')
          fi
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a numeric GitHub release ID for $TAG"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release
    needs: resolve-release
    runs-on: ubuntu-22.04
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config \
            libasound2-dev libdbus-1-dev libssl-dev \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libvulkan-dev \
            dpkg-dev rpm
          cargo install cargo-deb cargo-generate-rpm --locked
      - name: Stamp the release version
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml
      - name: Build packages
        run: |
          set -euo pipefail
          cargo build --release --locked -p floure-app
          cargo deb --no-build -p floure-app
          cargo generate-rpm -p crates/floure-app
          bash packaging/make-portable.sh
          ls -lh target/debian/*.deb target/generate-rpm/*.rpm target/portable/*.tar.gz
      - name: Verify the binary is self-contained
        run: |
          if ldd target/release/floure | grep -q 'not found'; then
            echo '::error::unresolved shared library'
            ldd target/release/floure
            exit 1
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            target/debian/*.deb \
            target/generate-rpm/*.rpm \
            target/portable/*.tar.gz \
            --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: floure-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/portable/*.tar.gz
          if-no-files-found: error

  arch-package:
    name: Build Arch Package
    needs: [resolve-release, release]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.resolve-release.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
      - name: Build package in Arch Linux
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/arch-build"
          mkdir -p "$build_dir/packaging"
          cp -a packaging/arch "$build_dir/packaging/arch"
          arch_pkgver="${VERSION//-/_}"
          sed -i -E "s/^pkgver=.*/pkgver=$arch_pkgver/" "$build_dir/packaging/arch/PKGBUILD"

          docker run --rm \
            --volume "$build_dir:/build" \
            --workdir /build/packaging/arch \
            archlinux:base-devel \
            /bin/bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                alsa-lib clang cmake dbus fontconfig freetype2 gcc-libs git \
                libx11 libxkbcommon openssl pkgconf rust vulkan-icd-loader wayland zstd
              useradd --create-home builder
              chown -R builder:builder /build
              runuser -u builder -- env CARGO_BUILD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2 makepkg --syncdeps --noconfirm
            '

          mapfile -t packages < <(find "$build_dir/packaging/arch" -maxdepth 1 -type f -name 'floure-*.pkg.tar.zst')
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Arch package, found ${#packages[@]}"
            exit 1
          fi
          mkdir -p release-assets
          cp "${packages[0]}" release-assets/
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$TAG" release-assets/*.pkg.tar.zst --clobber
